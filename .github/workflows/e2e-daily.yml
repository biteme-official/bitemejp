name: Daily E2E Purchase Flow Test

on:
  schedule:
    # Every day at 09:00 JST (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e
        run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: https://biteme.co.jp
        continue-on-error: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ github.run_number }}
          path: |
            playwright-report/
            e2e-results.json
            test-results/
          retention-days: 14

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: >-
            [BITEME JP] E2E Test ${{ steps.e2e.outcome == 'success' && 'PASSED' || 'FAILED' }} - ${{ github.run_number }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: BITEME Japan E2E <${{ secrets.GMAIL_USER }}>
          body: |
            BITEME JAPAN (biteme.co.jp) Daily E2E Test Report
            ================================================

            Result: ${{ steps.e2e.outcome == 'success' && 'ALL TESTS PASSED' || 'SOME TESTS FAILED' }}
            Date: ${{ github.event.repository.updated_at || github.event.head_commit.timestamp }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Tests executed:
            - Homepage loads with products
            - Product detail page renders correctly
            - Home → Product → Cart → Checkout entry (full purchase flow)

            ${{ steps.e2e.outcome != 'success' && 'ACTION REQUIRED: Please check the test report for details.' || 'No issues found.' }}

            --
            Automated by GitHub Actions
