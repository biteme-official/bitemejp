name: E2E Purchase Flow Test (Every 3h)

on:
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e
        run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: https://biteme.co.jp
        continue-on-error: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ github.run_number }}
          path: |
            playwright-report/
            e2e-results.json
            test-results/
          retention-days: 14

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ steps.e2e.outcome }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            TITLE="E2E PASSED"
            COLOR="#36a64f"
          else
            ICON="❌"
            TITLE="E2E FAILED"
            COLOR="#e01e5a"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "${ICON} [BITEME JP] ${TITLE} — Run #${{ github.run_number }}" }
              },
              { "type": "divider" },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*테스트 항목:*\n• 홈 상품 로드\n• 상품 상세 페이지\n• 홈→상품→장바구니→결제 진입" },
                  { "type": "mrkdwn", "text": "*사이트:*\n<https://biteme.co.jp|biteme.co.jp>" }
                ]
              },
              {
                "type": "context",
                "elements": [
                  { "type": "mrkdwn", "text": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|결과 상세 보기>" }
                ]
              }
            ]
          }
          EOF
          )

          curl -s -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$SLACK_WEBHOOK_URL"
